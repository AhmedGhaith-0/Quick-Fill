name: Build Geode Mod

on:
  push:
    branches: ["*"]

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          targets: "android64"
          sdk: "5.7.1"
